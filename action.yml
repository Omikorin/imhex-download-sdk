name: 'ImHex Download SDK'
description: 'Action that sets up necessary things to build ImHex plugins'
author: WerWolv
branding:
  icon: book
  color: blue

inputs:
  version:
    description: 'ImHex version to target (e.g., 1.39.0 or nightly)'
    required: true

  arch:
    description: 'Target architecture (x86_64 or arm64)'
    required: false
    default: 'x86_64'

  install_dependencies:
    description: 'Whether to install system dependencies via pacman/brew'
    required: false
    default: 'true'

  cache:
    description: 'Cache the downloaded ImHex SDK'
    required: false
    default: 'true'

outputs:
  sdk_path:
    description: 'Path to the ImHex SDK'
    value: ${{ steps.sdk_install.outputs.sdk_path }}

runs:
  using: 'composite'
  steps:
    - name: Check supported OS
      if: runner.os != 'Windows' && runner.os != 'macOS'
      shell: bash
      run: |
        echo "::error::Unsupported OS: ${{ runner.os }}. This action only supports Windows and macOS at this moment."
        exit 1

    - name: Determine version tag and MSYS2 subsystem
      id: vars
      shell: bash
      env:
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_ARCH: ${{ inputs.arch }}
      run: |
        VERSION="${INPUTS_VERSION}"
        ARCH="${INPUTS_ARCH}"

        if [ "$VERSION" = "nightly" ]; then
          echo "tag=nightly" >> $GITHUB_OUTPUT
          major=999 # dummy values to simplify checking
          minor=999
        else
          # split the version string by '.'
          IFS='.' read -r major minor patch <<< "$VERSION"

          # default to 0 in case the input is malformed
          major=${major:-0}
          minor=${minor:-0}
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        fi

        if [ "$ARCH" = "arm64" ]; then
          echo "msystem=clangarm64" >> $GITHUB_OUTPUT
        elif [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 39 ]; }; then
          echo "msystem=mingw64" >> $GITHUB_OUTPUT
        else
          echo "msystem=ucrt64" >> $GITHUB_OUTPUT
        fi

    - name: Fetch dependency files
      if: inputs.install_dependencies == 'true'
      shell: bash
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          wget https://raw.githubusercontent.com/WerWolv/ImHex/${STEPS_VARS_OUTPUTS_TAG}/dist/get_deps_msys2.sh
        else
          wget https://raw.githubusercontent.com/WerWolv/ImHex/${STEPS_VARS_OUTPUTS_TAG}/dist/Brewfile
        fi

    - name: Cache ImHex SDK
      if: inputs.cache == 'true'
      id: cache-sdk
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: imhex-sdk
        key: imhex-sdk-${{ runner.os }}-${{ inputs.version }}-${{ inputs.arch }}

    # Handle building on a Windows runner
    - name: Setup msys2
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: ${{ steps.vars.outputs.msystem }}

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows' && inputs.install_dependencies == 'true'
      shell: msys2 {0}
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
      run: |
        set -x
        chmod +x get_deps_msys2.sh
        ./get_deps_msys2.sh
        pacman -S --needed --noconfirm unzip

    - name: Download ImHex SDK (Windows)
      if: runner.os == 'Windows' && steps.cache-sdk.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_ARCH: ${{ inputs.arch }}
      run: |
        set -x
        wget https://github.com/WerWolv/ImHex/releases/download/${STEPS_VARS_OUTPUTS_TAG}/imhex-${INPUTS_VERSION}-Windows-Portable-${INPUTS_ARCH}.zip
        mkdir -p imhex_temp
        unzip imhex-${INPUTS_VERSION}-Windows-Portable-${INPUTS_ARCH}.zip -d imhex_temp
        mv imhex_temp/sdk imhex-sdk
        rm -rf imhex_temp imhex-${INPUTS_VERSION}-Windows-Portable-${INPUTS_ARCH}.zip

    # Handle building on a macOS runner
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS' && inputs.install_dependencies == 'true'
      shell: bash
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
      run: |
        set -x
        brew reinstall python || brew link --overwrite python
        brew bundle --no-lock --file Brewfile
        brew install sevenzip
        rm -rf /usr/local/Cellar/capstone

    - name: Download ImHex SDK (macOS)
      if: runner.os == 'macOS' && steps.cache-sdk.outputs.cache-hit != 'true'
      shell: bash
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_ARCH: ${{ inputs.arch }}
      run: |
        set -x
        wget https://github.com/WerWolv/ImHex/releases/download/${STEPS_VARS_OUTPUTS_TAG}/imhex-${INPUTS_VERSION}-macOS-${INPUTS_ARCH}.dmg
        7zz x -aoa -snld imhex-${INPUTS_VERSION}-macOS-${INPUTS_ARCH}.dmg -o"imhex_temp"
        mv imhex_temp/imhex.app/Contents/Resources/sdk imhex-sdk
        rm -rf imhex_temp imhex-${INPUTS_VERSION}-macOS-${INPUTS_ARCH}.dmg

    # Handle output
    - name: Set SDK Variable
      shell: bash
      id: sdk_install
      run: |
        set -x
        echo "sdk_path=$(pwd)/imhex-sdk" >> $GITHUB_OUTPUT
