name: 'ImHex Download SDK'
description: 'Action that sets up necessary things to build ImHex plugins'
author: WerWolv
branding:
  icon: book
  color: blue

inputs:
  version:
    description: 'ImHex version to target (e.g., 1.39.0 or nightly)'
    required: true

  arch:
    description: 'Target architecture (x86_64 or arm64). Defaults to auto-detecting the runner architecture.'
    required: false
    default: 'auto'

  install_dependencies:
    description: 'Whether to install system dependencies via pacman/brew'
    required: false
    default: 'true'

  cache:
    description: 'Cache the downloaded ImHex SDK'
    required: false
    default: 'true'

outputs:
  sdk_path:
    description: 'Path to the ImHex SDK'
    value: ${{ steps.sdk_install.outputs.sdk_path }}

runs:
  using: 'composite'
  steps:
    - name: Check supported OS
      if: runner.os != 'Windows' && runner.os != 'macOS'
      shell: bash
      run: |
        echo "::error::Unsupported OS: ${{ runner.os }}. This action only supports Windows and macOS at this moment."
        exit 1

    - name: Determine version tag and MSYS2 subsystem
      id: vars
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INPUT_ARCH: ${{ inputs.arch }}
      run: |
        set -e

        # determine architecture
        if [ "$INPUT_ARCH" = "auto" ]; then
          case "${{ runner.arch }}" in
            "ARM64")
              ARCH="arm64"
              ;;
            "X64")
              ARCH="x86_64"
              ;;
            *)
              echo "::warning::Unexpected runner architecture: ${{ runner.arch }}. Falling back to x86_64."
              ARCH="x86_64"
              ;;
          esac
        else
          ARCH="$INPUT_ARCH"
        fi

        echo "arch=$ARCH" >> $GITHUB_OUTPUT

        # determine version tag
        if [ "$VERSION" = "nightly" ]; then
          TAG="nightly"
        else
          TAG="v$VERSION"
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # version extraction
        if [ "$VERSION" = "nightly" ]; then
          FILE_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/WerWolv/ImHex/${TAG}/VERSION" | tr -d '[:space:]')
          echo "version=$FILE_VERSION" >> $GITHUB_OUTPUT

          major=999 # dummy values to simplify checking
          minor=999
        else
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # split the version string by '.'
          IFS='.' read -r major minor patch <<< "$VERSION"

          # default to 0 in case the input is malformed
          major=${major:-0}
          minor=${minor:-0}
        fi

        # determine msys2 subsystem
        if [ "$ARCH" = "arm64" ]; then
          echo "msystem=clangarm64" >> $GITHUB_OUTPUT
        elif [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 39 ]; }; then
          # deprecated mingw64 for versions < 1.39.0
          echo "msystem=mingw64" >> $GITHUB_OUTPUT
        else
          echo "msystem=ucrt64" >> $GITHUB_OUTPUT
        fi

    - name: Fetch dependency files
      if: inputs.install_dependencies == 'true'
      shell: bash
      env:
        TAG: ${{ steps.vars.outputs.tag }}
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          curl -fLO https://raw.githubusercontent.com/WerWolv/ImHex/${TAG}/dist/get_deps_msys2.sh
        else
          curl -fLO https://raw.githubusercontent.com/WerWolv/ImHex/${TAG}/dist/Brewfile
        fi

    - name: Cache ImHex SDK
      if: inputs.cache == 'true'
      id: cache-sdk
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: imhex-sdk
        key: imhex-sdk-${{ runner.os }}-${{ steps.vars.outputs.arch }}-${{ inputs.version }}

    # Handle building on a Windows runner
    - name: Setup msys2
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: ${{ steps.vars.outputs.msystem }}

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows' && inputs.install_dependencies == 'true'
      shell: msys2 {0}
      run: |
        set -x
        chmod +x get_deps_msys2.sh
        ./get_deps_msys2.sh
        pacman -S --needed --noconfirm unzip

    - name: Download ImHex SDK (Windows)
      if: runner.os == 'Windows' && steps.cache-sdk.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        TAG: ${{ steps.vars.outputs.tag }}
        VERSION: ${{ steps.vars.outputs.version }}
        ARCH: ${{ steps.vars.outputs.arch }}
      run: |
        set -x
        curl -fLO https://github.com/WerWolv/ImHex/releases/download/${TAG}/imhex-${VERSION}-Windows-Portable-${ARCH}.zip

        unzip imhex-${VERSION}-Windows-Portable-${ARCH}.zip -d imhex_temp
        mv imhex_temp/sdk imhex-sdk
        rm -rf imhex_temp imhex-${VERSION}-Windows-Portable-${ARCH}.zip

    # Handle building on a macOS runner
    - name: Get Homebrew cache path
      if: runner.os == 'macOS' && inputs.cache == 'true'
      id: brew-cache-dir
      shell: bash
      run: |
        echo "path=$(brew --cache)" >> $GITHUB_OUTPUT

    - name: Cache Homebrew downloads
      if: runner.os == 'macOS' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.brew-cache-dir.outputs.path }}
        key: brew-${{ runner.os }}-${{ steps.vars.outputs.arch }}-${{ hashFiles('Brewfile') }}
        restore-keys: |
          brew-${{ runner.os }}-${{ steps.vars.outputs.arch }}-

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS' && inputs.install_dependencies == 'true'
      shell: bash
      run: |
        set -x
        brew reinstall python || brew link --overwrite python
        brew bundle --no-lock --file Brewfile
        rm -rf /usr/local/Cellar/capstone

    - name: Download ImHex SDK (macOS)
      if: runner.os == 'macOS' && steps.cache-sdk.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: ${{ steps.vars.outputs.tag }}
        VERSION: ${{ steps.vars.outputs.version }}
        ARCH: ${{ steps.vars.outputs.arch }}
      run: |
        set -x
        curl -fLO https://github.com/WerWolv/ImHex/releases/download/${TAG}/imhex-${VERSION}-macOS-${ARCH}.dmg

        hdiutil attach "imhex-${VERSION}-macOS-${ARCH}.dmg" -mountpoint "/Volumes/ImHex" -nobrowse -quiet
        cp -r "/Volumes/ImHex/ImHex.app/Contents/Resources/sdk" imhex-sdk
        hdiutil detach "/Volumes/ImHex" -quiet
        rm -f "imhex-${VERSION}-macOS-${ARCH}.dmg"

    # Handle output
    - name: Set SDK Variable
      shell: bash
      id: sdk_install
      run: |
        set -x
        echo "sdk_path=$(pwd)/imhex-sdk" >> $GITHUB_OUTPUT
