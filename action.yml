name: 'ImHex Plugin'
description: 'Action that sets up necessary things to build ImHex plugins'
author: WerWolv
branding:
  icon: book
  color: blue

inputs:
  imhex_version:
    description: 'ImHex version to target (e.g., 1.39.0 or nightly)'
    required: true

outputs:
  sdk_path:
    description: 'Path to the ImHex SDK'
    value: ${{ steps.sdk_install.outputs.sdk_path }}

runs:
  using: 'composite'
  steps:
    - name: Determine version tag
      id: vars
      shell: bash
      run: |
        VERSION="${{ inputs.imhex_version }}"
        if [ "$VERSION" = "nightly" ]; then
          echo "tag=nightly" >> $GITHUB_OUTPUT
        else
          # split the version string by '.'
          IFS='.' read -r major minor patch <<< "$VERSION"
          
          # default to 0 in case the input is malformed
          major=${major:-0}
          minor=${minor:-0}
          
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 39 ]; }; then
            echo "::error::For ImHex versions below 1.39.0, please use the v1 version of this action."
            exit 1
          fi
          
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        fi

    # Handle building on a Windows runner
    - name: Install msys2
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64

    - name: Install dependencies
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        set -x
        wget https://raw.githubusercontent.com/WerWolv/ImHex/${{ steps.vars.outputs.tag }}/dist/get_deps_msys2.sh
        chmod +x get_deps_msys2.sh
        ./get_deps_msys2.sh
        pacman -S --needed --noconfirm unzip

    - name: Install ImHex SDK
      if: runner.os == 'Windows'
      id: sdk_install_win
      shell: msys2 {0}
      run: |
        set -x
        wget https://github.com/WerWolv/ImHex/releases/download/${{ steps.vars.outputs.tag }}/imhex-${{ inputs.imhex_version }}-Windows-Portable-x86_64.zip
        mkdir -p imhex
        unzip imhex-${{ inputs.imhex_version }}-Windows-Portable-x86_64.zip -d imhex
        echo "sdk_path=$(pwd)/imhex/sdk" >> $GITHUB_OUTPUT

    # Handle building on a macOS runner
    - name: Install dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -x
        wget https://raw.githubusercontent.com/WerWolv/ImHex/${{ steps.vars.outputs.tag }}/dist/Brewfile
        brew reinstall python || brew link --overwrite python
        brew bundle --no-lock --file Brewfile
        rm -rf /usr/local/Cellar/capstone

    - name: Install ImHex SDK
      if: runner.os == 'macOS'
      id: sdk_install_macos
      shell: bash
      run: |
        set -x
        wget https://github.com/WerWolv/ImHex/releases/download/${{ steps.vars.outputs.tag }}/imhex-${{ inputs.imhex_version }}-macOS-x86_64.dmg
        brew install sevenzip
        7zz x -aoa -snld imhex-${{ inputs.imhex_version }}-macOS-x86_64.dmg || true
        echo "sdk_path=$(pwd)/imhex-${{ inputs.imhex_version }}-macOS-x86_64/imhex.app/Contents/Resources/sdk" >> $GITHUB_OUTPUT

    - name: Set SDK Variable
      shell: bash
      id: sdk_install
      run: |
        set -x
        WIN_PATH="${{ steps.sdk_install_win.outputs.sdk_path }}"
        MAC_PATH="${{ steps.sdk_install_macos.outputs.sdk_path }}"
        if [ -z "$WIN_PATH" ]; then
            echo "sdk_path=$MAC_PATH" >> $GITHUB_OUTPUT
        else
            echo "sdk_path=$WIN_PATH" >> $GITHUB_OUTPUT
        fi
